name: Auto release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check package version change
        id: changes
        run: |
          old_version=$(git show "${{ github.event.before }}:pubspec.yaml" | awk '/^version:/ {print $2; exit}')
          new_version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          if [ -z "$old_version" ] || [ -z "$new_version" ]; then
            echo "Failed to read the old or new package version."
            exit 1
          fi
          if [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Package version changed from $old_version to $new_version."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Package version remains $new_version; skipping release."
          fi
      - name: Compute tag
        id: tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          package=$(awk '/^name:/ {print $2}' pubspec.yaml)
          version=$(awk '/^version:/ {print $2}' pubspec.yaml)
          if [ -z "$package" ] || [ -z "$version" ]; then
            echo "Failed to read package name or version from pubspec.yaml"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" = "main" ] && echo "$version" | grep -q '-'; then
            echo "Main requires a stable version (no pre-release suffix)."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" = "dev" ] && ! echo "$version" | grep -q '-'; then
            echo "Dev requires a pre-release version suffix (e.g. -dev.1)."
            exit 1
          fi
          echo "tag=${package}-v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check release tag
        id: tag_state
        if: steps.changes.outputs.changed == 'true'
        run: >-
          bash .github/scripts/check-release-tag.sh
          "${{ steps.tag.outputs.tag }}" "$GITHUB_SHA" "$GITHUB_OUTPUT"
      - name: Create release tag
        if: >-
          steps.changes.outputs.changed == 'true' &&
          steps.tag_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_PAT }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAG_PUSH_PAT is required to create release tags."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA"
      - name: Create GitHub release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.version, '-') || github.ref_name == 'dev' }}
